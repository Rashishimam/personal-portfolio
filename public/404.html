<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Rashish Imam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background-color: #050811;
        color: #e2e8f0;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
        overflow: hidden;
        position: relative;
      }
      .ambient-glow {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(6, 182, 212, 0.12) 0%, rgba(5, 8, 17, 0) 70%);
        pointer-events: none;
      }
      .card {
        position: relative;
        z-index: 10;
        max-width: 520px;
        background: rgba(10, 16, 30, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(56, 189, 248, 0.15);
        border-radius: 24px;
        padding: 48px 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .badge {
        display: inline-block;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: #38bdf8;
        background: rgba(6, 182, 212, 0.15);
        border: 1px solid rgba(56, 189, 248, 0.3);
        padding: 6px 14px;
        border-radius: 9999px;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #ffffff 0%, #38bdf8 60%, #06b6d4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h2 {
        font-size: 20px;
        font-weight: 600;
        color: #f1f5f9;
        margin-bottom: 12px;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 28px;
        border-radius: 12px;
        background: linear-gradient(135deg, #06b6d4 0%, #2563eb 100%);
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 10px 25px rgba(6, 182, 212, 0.25);
        transition: all 0.2s ease;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(6, 182, 212, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="ambient-glow"></div>
    <div class="card">
      <div class="badge">404 Error • Route Not Found</div>
      <h1>404</h1>
      <h2>Page Does Not Exist</h2>
      <p>The page or resource you are looking for has been moved or does not exist in Rashish Imam's portfolio directory.</p>
      <a href="/" class="btn">
        <span>← Return to Home</span>
      </a>
    </div>
  </body>
</html>
